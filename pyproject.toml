[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyp6xer-mcp"
version = "1.2.1"
description = "MCP server for parsing and analysing Primavera P6 XER schedule files"
requires-python = ">=3.13"
dependencies = [
    "fastmcp==3.2.4",
    "httpx==0.28.1",
    "mcp==1.27.0",
    "pydantic==2.12.5",
    "prometheus-client==0.24.1",
    "xerparser==0.13.9",
]

[project.urls]
Homepage = "https://pyp6xer-mcp.fly.dev"
Repository = "https://github.com/paulieb89/pyp6xer-mcp"
PyPI = "https://pypi.org/project/pyp6xer-mcp/"

[project.scripts]
pyp6xer-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
